# Render Blueprint — review costs and environment before deploying.
databases:
  - name: minha-agenda-db
    databaseName: minha_agenda
    user: agenda_app
    plan: basic-256mb
services:
  - type: web
    name: minha-agenda-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minha-agenda-db
          property: connectionString
      - key: AGENDA_ALLOWED_ORIGINS
        value: https://jvfs06.github.io
      - key: AGENDA_SECURE_COOKIES
        value: "1"
