name: PWA checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static smoke tests
        run: node --test tests/smoke.test.mjs
